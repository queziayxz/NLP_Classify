<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Caed</title>
  <style>
    :root {
      --bg: #fafaf9; --fg: #1c1917; --muted: #6b6560; --card: #ffffff; --border: #e4e0dc;
      --accent: #2563eb; --accent-fg: #ffffff; --canon: #bbf7d0; --warn-bg: #fef3c7; --warn-fg: #78350f;
      --err-bg: #fee2e2; --err-fg: #7f1d1d; --bar-bg: #ece9e5;
      --n0: #16a34a; --n1: #0ea5e9; --n2: #f59e0b; --n3: #9333ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151413; --fg: #f1efed; --muted: #a39d97; --card: #1f1d1b; --border: #34312e;
        --accent: #60a5fa; --accent-fg: #0b1220; --canon: #14532d; --warn-bg: #3b2f0b; --warn-fg: #fde68a;
        --err-bg: #450a0a; --err-fg: #fecaca; --bar-bg: #2d2a27;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 28px 16px 64px; }
    h1 { font-size: 1.8rem; margin: 0 0 4px; }
    h2 { font-size: 1.05rem; margin: 0 0 10px; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: 1rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px 24px; margin-bottom: 16px; }
    textarea { width: 100%; min-height: 180px; resize: vertical; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
               background: var(--bg); color: var(--fg); font: inherit; }
    textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .linha { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; margin-top: 10px; }
    .grow { flex: 1; }
    button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--card);
             color: var(--fg); cursor: pointer; transition: background 0.2s, opacity 0.2s; }
    button.primario { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
    button.primario:hover { opacity: 0.9; }
    button:disabled { opacity: .6; cursor: progress; }
    .muted { color: var(--muted); font-size: .9rem; }
    .aviso { background: var(--warn-bg); color: var(--warn-fg); padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; }
    .erro { background: var(--err-bg); color: var(--err-fg); padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; }
    .nivel { font-size: 1.7rem; font-weight: 700; margin: 0; }
    .barra { display: grid; grid-template-columns: 150px 1fr 52px; gap: 8px; align-items: center; margin: 6px 0; font-size: .95rem; }
    .trilho { background: var(--bar-bg); border-radius: 99px; height: 12px; overflow: hidden; }
    .preench { height: 100%; border-radius: 99px; }
    .texto-marcado { white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; padding: 10px;
                     border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
    .texto-marcado.destacar .canon { background: var(--canon); border-radius: 3px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { background: var(--bar-bg); border-radius: 99px; padding: 3px 10px; font-size: .9rem; }
    .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .metrica { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
    .metrica b { display: block; font-size: 1.15rem; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    details summary { cursor: pointer; font-weight: 600; }
    .oculto { display: none; }

    /* Centralização da página inicial */
    .hero-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
      text-align: center;
    }
  </style>
</head>
<body>

  <main class="hero-container">
    <div class="card" style="width: 100%; max-width: 520px;">
      <h1>Desafio Caed</h1>
      <p class="sub">Estagiário em pesquisa de avaliação</p>
      
      <div class="linha">
        <button class="primario" onclick="navegarParaModelo()">Modelo de Classificação</button>
        <button class="primario" onclick="navegarParaMutacao()">Operações de Mutação</button>
      </div>
    </div>
  </main>

  <script>
    // Função para direcionar à página do Modelo de Classificação
    function navegarParaModelo() {
      // -------------------------------------------------------------
      // COLOQUE ABAIXO A URL DA API OU DA PÁGINA DO MODELO
      // Exemplo: "/modelo" ou "http://127.0.0.1:8000/app/classify-page"
      // -------------------------------------------------------------
      const urlModelo = "/app/model";

      window.location.href = urlModelo;
    }

    // Função para direcionar à página de Operações de Mutação
    function navegarParaMutacao() {
      // -------------------------------------------------------------
      // COLOQUE ABAIXO A URL DA API OU DA PÁGINA DE MUTAÇÃO
      // Exemplo: "/mutacao" ou "http://127.0.0.1:8000/app/mutation-page"
      // -------------------------------------------------------------
      const urlMutacao = "/app/mutation";

      window.location.href = urlMutacao;
    }
  </script>

</body>
</html>
